<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Pix Sem Limites — Campanha</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --cd-navy: #16294F;
    --cd-orange: #F26B2E;
    --ink: #1F2430;
    --muted: #7C8394;
    --line: #E7E9EE;
    --panel: #F5F6F9;
  }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #FFFFFF;
    color: var(--ink);
    overflow: hidden;
  }
  .wrap {
    width: 100%;
    height: 100%;
    padding: 10px 18px 12px;
    display: flex;
    flex-direction: column;
  }

  /* Tamanhos calculados via JS a partir da altura real renderizada (fitToHeight()) — nunca fixos em px,
     pra se adaptar automaticamente a qualquer altura de iframe/zoom sem cortar nem sobrar espaço. */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: calc(var(--header-h, 400px) * 0.02);
    margin-bottom: calc(var(--wrap-h, 400px) * 0.015);
    flex-wrap: nowrap;
    overflow: hidden;
  }
  .title-row { display: flex; align-items: center; gap: calc(var(--header-h, 400px) * 0.02); overflow: hidden; flex: 1 1 auto; min-width: 0; }
  .money-icon { flex: none; width: calc(var(--header-h, 400px) * 0.09); height: calc(var(--header-h, 400px) * 0.09); }
  .title {
    flex: none;
    font-size: calc(var(--header-h, 400px) * 0.095);
    font-weight: 800;
    white-space: nowrap;
    color: var(--cd-navy);
  }
  .title span { color: var(--cd-orange); }
  .subtitle {
    flex: 1 1 auto;
    min-width: 0;
    font-size: calc(var(--header-h, 400px) * 0.042);
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-left: calc(var(--header-h, 400px) * 0.012);
  }
  .updated-box {
    flex: none;
    display: flex;
    align-items: center;
    gap: calc(var(--header-h, 400px) * 0.015);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: calc(var(--header-h, 400px) * 0.02) calc(var(--header-h, 400px) * 0.035);
    white-space: nowrap;
    font-size: calc(var(--header-h, 400px) * 0.042);
    color: var(--muted);
  }
  .updated-box b { color: var(--cd-orange); font-weight: 700; }

  /* ===== painéis lado a lado ===== */
  .panels {
    display: flex;
    gap: 16px;
    flex: 1 1 auto;
    min-height: 0;
  }
  .panel {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: calc(var(--wrap-h, 400px) * 0.02) 14px;
    background: #FFFFFF;
  }
  .panel-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: calc(var(--wrap-h, 400px) * 0.012);
    overflow: hidden;
  }
  .panel-title {
    font-size: calc(var(--panelhead-h, 400px) * 0.065);
    font-weight: 800;
    color: var(--cd-navy);
    white-space: nowrap;
  }
  .panel-range {
    flex: none;
    font-size: calc(var(--panelhead-h, 400px) * 0.045);
    color: var(--muted);
    font-weight: 600;
    white-space: nowrap;
  }

  .rows { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: space-between; gap: 4px; min-height: 0; }

  .row {
    position: relative;
    display: flex;
    align-items: center;
    gap: calc(var(--row-h, 60px) * 0.18);
    padding: 0 calc(var(--row-h, 60px) * 0.16);
    border-radius: 8px;
    overflow: hidden;
    flex: 1 1 0;
    min-height: 0;
  }
  .bar-bg {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    background: var(--bar-color, var(--cd-navy));
    opacity: 0.13;
    border-radius: 8px;
    transition: width 1s cubic-bezier(.22,1,.36,1);
  }
  .row.rank-1 .bar-bg { opacity: 0.16; }

  .rank-badge {
    position: relative;
    flex: none;
    width: calc(var(--row-h, 60px) * 0.56);
    height: calc(var(--row-h, 60px) * 0.56);
    border-radius: 50%;
    background: var(--muted);
    color: #fff;
    font-size: calc(var(--row-h, 60px) * 0.28);
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .row.rank-1 .rank-badge { background: var(--cd-orange); }

  .name {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    font-size: calc(var(--row-h, 60px) * 0.34);
    font-weight: 700;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: calc(var(--row-h, 60px) * 0.08);
  }
  .row.rank-1 .name { color: var(--cd-navy); }
  .crown { flex: none; font-size: calc(var(--row-h, 60px) * 0.3); }
  .name-text {
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .value-wrap {
    position: relative;
    flex: none;
    display: flex;
    align-items: baseline;
    gap: calc(var(--row-h, 60px) * 0.1);
  }
  .value {
    font-size: calc(var(--row-h, 60px) * 0.56);
    font-weight: 800;
    color: var(--cd-orange);
    white-space: nowrap;
    line-height: 1;
    letter-spacing: -0.3px;
  }
  .qtd {
    font-size: calc(var(--row-h, 60px) * 0.22);
    color: var(--muted);
    white-space: nowrap;
  }

  @media (max-width: 720px) {
    .panels { flex-direction: column; }
    .subtitle { display: none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <div class="title-row">
      <svg class="money-icon" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" fill="#16294F"/>
        <path d="M12 6.5v11M15.2 8.7c0-1.2-1.4-2.2-3.2-2.2s-3.2 1-3.2 2.2c0 1.2 1.4 1.7 3.2 2 1.8.3 3.2.8 3.2 2 0 1.2-1.4 2.2-3.2 2.2s-3.2-1-3.2-2.2" stroke="#F26B2E" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <div class="title">Pix Sem <span>Limites</span></div>
      <div class="subtitle">reservas criadas por colaborador · exclui pré-reserva e cancelamento</div>
    </div>
    <div class="updated-box">
      Atualizado <b id="lastUpdated">—</b>
    </div>
  </div>

  <div class="panels">
    <div class="panel" id="panel-quinzena">
      <div class="panel-head">
        <div class="panel-title">Quinzenal</div>
        <div class="panel-range" id="range-quinzena">—</div>
      </div>
      <div class="rows" id="rows-quinzena"></div>
    </div>
    <div class="panel" id="panel-mes">
      <div class="panel-head">
        <div class="panel-title">Acumulado do Mês</div>
        <div class="panel-range" id="range-mes">—</div>
      </div>
      <div class="rows" id="rows-mes"></div>
    </div>
    <div class="panel" id="panel-anual">
      <div class="panel-head">
        <div class="panel-title">Vendedor do Ano</div>
        <div class="panel-range" id="range-anual">—</div>
      </div>
      <div class="rows" id="rows-anual"></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://ucavfotyciwnqwurzjny.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjYXZmb3R5Y2l3bnF3dXJ6am55Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc5NzUzNjYsImV4cCI6MjA3MzU1MTM2Nn0.nE_W8wZZvJfzlvhP83ge1J0ooS3EcFVSlQYK28eTGU0";

const COMPETITORS = [
  { operador: "Maria Eduarda de Oliveira Macêdo", displayName: "Duda",  color: "#2C4770" },
  { operador: "Igor Soares Nascimento",           displayName: "Igor",  color: "#D97A42" },
  { operador: "Luisa Elisa Trindade de Oliveira", displayName: "Luisa", color: "#4C8C8B" },
  { operador: "Yara Amélia de Almeida Wanderley", displayName: "Yara",  color: "#C9963E" },
];

function formatBRL(v) {
  return v.toLocaleString("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
}

function pad2(n) { return String(n).padStart(2, "0"); }
function formatRange(start, end) {
  return `${pad2(start.getDate())}/${pad2(start.getMonth() + 1)} – ${pad2(end.getDate())}/${pad2(end.getMonth() + 1)}`;
}

// Mesma regra de virada da edge function: quinzena 1 = dia 1-14, quinzena 2 = dia 15-fim do mês.
// Ao virar o mês ou passar do dia 15, os rótulos (e os dados, via cache) mudam sozinhos — sem reset manual.
function computePeriodLabels() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), day = now.getDate();
  const mesInicio = new Date(y, m, 1);
  const mesFim = new Date(y, m + 1, 0);
  const [quinzenaInicio, quinzenaFim] = day <= 14
    ? [new Date(y, m, 1), new Date(y, m, 14)]
    : [new Date(y, m, 15), mesFim];

  const MONTH_ABBR = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
  let lastClosedM = m - 1, lastClosedY = y;
  if (lastClosedM < 0) { lastClosedM = 11; lastClosedY -= 1; }
  const anual = `fev – ${MONTH_ABBR[lastClosedM]}/${String(lastClosedY).slice(-2)}`;

  return {
    quinzena: formatRange(quinzenaInicio, quinzenaFim),
    mes: formatRange(mesInicio, mesFim),
    anual,
  };
}

async function fetchRpc(name) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`, {
    method: "POST",
    headers: {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json",
    },
    body: "{}",
  });
  if (!res.ok) throw new Error(`Falha ao buscar ${name}`);
  return res.json();
}

function renderPanel(containerId, merged, valueKey, qtdKey) {
  const sorted = [...merged].sort((a, b) => b[valueKey] - a[valueKey]);
  const maxVal = Math.max(1, sorted[0][valueKey]);
  const container = document.getElementById(containerId);

  container.innerHTML = sorted.map((c, idx) => `
    <div class="row${idx === 0 ? " rank-1" : ""}" style="--bar-color:${c.color}">
      <div class="bar-bg" style="width:${(c[valueKey] / maxVal) * 100}%"></div>
      <div class="rank-badge">${idx + 1}</div>
      <div class="name">${idx === 0 ? '<span class="crown">🏆</span>' : ""}<span class="name-text">${c.displayName}</span></div>
      <div class="value-wrap">
        <span class="value">${formatBRL(c[valueKey])}</span>
        <span class="qtd">${c[qtdKey]} res.</span>
      </div>
    </div>
  `).join("");
}

function renderAnualPanel(containerId, merged) {
  const sorted = [...merged].sort((a, b) => b.titulos - a.titulos);
  const maxVal = Math.max(1, sorted[0].titulos);
  const container = document.getElementById(containerId);

  container.innerHTML = sorted.map((c, idx) => `
    <div class="row${idx === 0 && c.titulos > 0 ? " rank-1" : ""}" style="--bar-color:${c.color}">
      <div class="bar-bg" style="width:${(c.titulos / maxVal) * 100}%"></div>
      <div class="rank-badge">${idx + 1}</div>
      <div class="name">${idx === 0 && c.titulos > 0 ? '<span class="crown">🏆</span>' : ""}<span class="name-text">${c.displayName}</span></div>
      <div class="value-wrap">
        <span class="value">${c.titulos}</span>
        <span class="qtd">${c.titulos === 1 ? "título" : "títulos"}</span>
      </div>
    </div>
  `).join("");
}

// Mede o espaço real que o navegador/iframe deu pra página (seja qual for — TV, editor do Jestor,
// zoom diferente, 2 ou 3 colunas etc.) e calcula o tamanho das fontes a partir disso, em duas etapas:
// 1) altura disponível define um tamanho "ideal" (--wrap-h/--header-h/--panelhead-h/--row-h);
// 2) um corretor por largura reduz esses tamanhos se o texto (nome, valor em R$, título do painel...)
//    não couber na largura da coluna — sem isso, valores longos (R$ 209.667) estourariam colunas
//    estreitas (com 3 painéis lado a lado) e ficariam cortados.
function worstFitRatio(elements) {
  let minRatio = 1;
  elements.forEach((el) => {
    if (el.clientWidth > 0 && el.scrollWidth > el.clientWidth + 0.5) {
      minRatio = Math.min(minRatio, el.clientWidth / el.scrollWidth);
    }
  });
  return minRatio;
}

function currentVarPx(varName, fallback) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(varName);
  const n = parseFloat(raw);
  return Number.isFinite(n) && n > 0 ? n : fallback;
}

// Nunca aplica mais que ~15% de corte por rodada: se o nome já colapsou pra ~0px (porque o valor em
// R$ tomou todo o espaço), a razão bruta cai perto de 0 e um corte "de uma vez" achataria a fonte pro
// piso. Cortando aos poucos, o valor (que depende da mesma var) também encolhe a cada rodada e sobra
// espaço real pro nome — convergindo em poucas iterações em vez de colapsar na primeira.
const MAX_STEP_CUT = 0.85;

function shrinkLoop() {
  const root = document.documentElement;
  for (let i = 0; i < 16; i++) {
    let changed = false;

    const headerRatio = worstFitRatio([document.querySelector(".header")].filter(Boolean));
    if (headerRatio < 0.995) {
      const cur = currentVarPx("--header-h", 400);
      root.style.setProperty("--header-h", Math.max(cur * Math.max(headerRatio, MAX_STEP_CUT), 10) + "px");
      changed = true;
    }

    const panelHeadRatio = worstFitRatio([...document.querySelectorAll(".panel-head")]);
    if (panelHeadRatio < 0.995) {
      const cur = currentVarPx("--panelhead-h", 400);
      root.style.setProperty("--panelhead-h", Math.max(cur * Math.max(panelHeadRatio, MAX_STEP_CUT), 10) + "px");
      changed = true;
    }

    // Considera tanto o overflow da linha inteira quanto do nome sozinho: o flex faz o nome encolher
    // silenciosamente (sem a linha "estourar"), então só checar ".row" não pega nome cortado demais.
    const rowRatio = worstFitRatio([
      ...document.querySelectorAll(".row"),
      ...document.querySelectorAll(".name-text"),
    ]);
    if (rowRatio < 0.995) {
      const cur = currentVarPx("--row-h", 60);
      root.style.setProperty("--row-h", Math.max(cur * Math.max(rowRatio, MAX_STEP_CUT), 10) + "px");
      changed = true;
    }

    if (!changed) break;
  }
}

function fitToHeight() {
  const root = document.documentElement;
  const wrap = document.querySelector(".wrap");
  const wrapH = wrap.getBoundingClientRect().height;
  root.style.setProperty("--wrap-h", wrapH + "px");
  root.style.setProperty("--header-h", wrapH + "px");
  root.style.setProperty("--panelhead-h", wrapH + "px");

  const firstRow = document.querySelector(".row");
  const rowH = firstRow ? firstRow.getBoundingClientRect().height : 60;
  root.style.setProperty("--row-h", rowH + "px");

  const subtitle = document.querySelector(".subtitle");
  if (subtitle) subtitle.style.display = "";
  shrinkLoop();

  // Se mesmo encolhendo o título ele ainda ficar pequeno demais (< 55% do tamanho ideal), o espaço é
  // curto demais pro subtítulo — some com ele e recalcula, priorizando o título "Pix Sem Limites".
  if (subtitle) {
    const headerScale = currentVarPx("--header-h", wrapH) / wrapH;
    if (headerScale < 0.55) {
      subtitle.style.display = "none";
      root.style.setProperty("--header-h", wrapH + "px");
      shrinkLoop();
    }
  }
}

async function refresh() {
  try {
    const [rows, anualRows] = await Promise.all([
      fetchRpc("pix_sem_limites_leaderboard"),
      fetchRpc("pix_vendedor_do_ano_leaderboard"),
    ]);

    const byOperador = {};
    rows.forEach(r => { byOperador[r.operador] = r; });

    const merged = COMPETITORS.map(c => {
      const row = byOperador[c.operador] || { faturamento_quinzena: 0, qtd_quinzena: 0, faturamento_mes: 0, qtd_mes: 0 };
      return {
        ...c,
        faturamento_quinzena: Number(row.faturamento_quinzena) || 0,
        qtd_quinzena: row.qtd_quinzena || 0,
        faturamento_mes: Number(row.faturamento_mes) || 0,
        qtd_mes: row.qtd_mes || 0,
      };
    });

    const byOperadorAnual = {};
    anualRows.forEach(r => { byOperadorAnual[r.operador] = r; });
    const mergedAnual = COMPETITORS.map(c => ({
      ...c,
      titulos: Number((byOperadorAnual[c.operador] || {}).titulos) || 0,
    }));

    renderPanel("rows-quinzena", merged, "faturamento_quinzena", "qtd_quinzena");
    renderPanel("rows-mes", merged, "faturamento_mes", "qtd_mes");
    renderAnualPanel("rows-anual", mergedAnual);

    document.getElementById("lastUpdated").textContent = new Date().toLocaleTimeString("pt-BR");
    fitToHeight();
  } catch (e) {
    console.error(e);
  }
}

function renderPeriodLabels() {
  const { quinzena, mes, anual } = computePeriodLabels();
  document.getElementById("range-quinzena").textContent = quinzena;
  document.getElementById("range-mes").textContent = mes;
  document.getElementById("range-anual").textContent = anual;
}

renderPeriodLabels();
refresh();
setInterval(refresh, 60 * 1000);
setInterval(renderPeriodLabels, 60 * 1000);
window.addEventListener("resize", fitToHeight);
</script>

</body>
</html>
