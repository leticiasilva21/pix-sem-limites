<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Pix Sem Limites — Campanha</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --cd-navy: #16294F;
    --cd-orange: #F26B2E;
    --ink: #1F2430;
    --muted: #7C8394;
    --line: #E7E9EE;
    --panel: #F5F6F9;
  }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #FFFFFF;
    color: var(--ink);
    overflow: hidden;
  }
  .wrap {
    width: 100%;
    height: 100%;
    padding: 10px 18px 12px;
    display: flex;
    flex-direction: column;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
    flex-wrap: nowrap;
  }
  .title-row { display: flex; align-items: center; gap: 9px; overflow: hidden; }
  .money-icon { flex: none; width: 24px; height: 24px; }
  .title {
    font-size: 22px;
    font-weight: 800;
    white-space: nowrap;
    color: var(--cd-navy);
  }
  .title span { color: var(--cd-orange); }
  .subtitle {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    margin-left: 6px;
  }
  .updated-box {
    flex: none;
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 14px;
    white-space: nowrap;
    font-size: 12px;
    color: var(--muted);
  }
  .updated-box b { color: var(--cd-orange); font-weight: 700; }

  /* ===== painéis lado a lado ===== */
  .panels {
    display: flex;
    gap: 16px;
    flex: 1 1 auto;
    min-height: 0;
  }
  .panel {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 14px 10px;
    background: #FFFFFF;
  }
  .panel-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .panel-title {
    font-size: 15px;
    font-weight: 800;
    color: var(--cd-navy);
  }
  .panel-range {
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
  }

  .rows { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: space-between; gap: 4px; }

  .row {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 10px;
    border-radius: 8px;
    overflow: hidden;
    flex: 1 1 0;
  }
  .bar-bg {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    background: var(--bar-color, var(--cd-navy));
    opacity: 0.13;
    border-radius: 8px;
    transition: width 1s cubic-bezier(.22,1,.36,1);
  }
  .row.rank-1 .bar-bg { opacity: 0.16; }

  .rank-badge {
    position: relative;
    flex: none;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--muted);
    color: #fff;
    font-size: 11px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .row.rank-1 .rank-badge { background: var(--cd-orange); }

  .name {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .row.rank-1 .name { color: var(--cd-navy); }
  .crown { font-size: 13px; }

  .value-wrap {
    position: relative;
    flex: none;
    display: flex;
    align-items: baseline;
    gap: 7px;
  }
  .value {
    font-size: 26px;
    font-weight: 800;
    color: var(--cd-orange);
    white-space: nowrap;
    line-height: 1;
    letter-spacing: -0.3px;
  }
  .qtd {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  @media (max-width: 720px) {
    .panels { flex-direction: column; }
    .subtitle { display: none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <div class="title-row">
      <svg class="money-icon" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" fill="#16294F"/>
        <path d="M12 6.5v11M15.2 8.7c0-1.2-1.4-2.2-3.2-2.2s-3.2 1-3.2 2.2c0 1.2 1.4 1.7 3.2 2 1.8.3 3.2.8 3.2 2 0 1.2-1.4 2.2-3.2 2.2s-3.2-1-3.2-2.2" stroke="#F26B2E" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <div class="title">Pix Sem <span>Limites</span></div>
      <div class="subtitle">reservas criadas por colaborador · exclui pré-reserva e cancelamento</div>
    </div>
    <div class="updated-box">
      Atualizado <b id="lastUpdated">—</b>
    </div>
  </div>

  <div class="panels">
    <div class="panel" id="panel-quinzena">
      <div class="panel-head">
        <div class="panel-title">Quinzenal</div>
        <div class="panel-range" id="range-quinzena">—</div>
      </div>
      <div class="rows" id="rows-quinzena"></div>
    </div>
    <div class="panel" id="panel-mes">
      <div class="panel-head">
        <div class="panel-title">Acumulado do Mês</div>
        <div class="panel-range" id="range-mes">—</div>
      </div>
      <div class="rows" id="rows-mes"></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://ucavfotyciwnqwurzjny.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjYXZmb3R5Y2l3bnF3dXJ6am55Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc5NzUzNjYsImV4cCI6MjA3MzU1MTM2Nn0.nE_W8wZZvJfzlvhP83ge1J0ooS3EcFVSlQYK28eTGU0";

const COMPETITORS = [
  { operador: "Maria Eduarda de Oliveira Macêdo", displayName: "Duda",  color: "#2C4770" },
  { operador: "Igor Soares Nascimento",           displayName: "Igor",  color: "#D97A42" },
  { operador: "Luisa Elisa Trindade de Oliveira", displayName: "Luisa", color: "#4C8C8B" },
  { operador: "Yara Amélia de Almeida Wanderley", displayName: "Yara",  color: "#C9963E" },
];

function formatBRL(v) {
  return v.toLocaleString("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
}

function pad2(n) { return String(n).padStart(2, "0"); }
function formatRange(start, end) {
  return `${pad2(start.getDate())}/${pad2(start.getMonth() + 1)} – ${pad2(end.getDate())}/${pad2(end.getMonth() + 1)}`;
}

// Mesma regra de virada da edge function: quinzena 1 = dia 1-14, quinzena 2 = dia 15-fim do mês.
// Ao virar o mês ou passar do dia 15, os rótulos (e os dados, via cache) mudam sozinhos — sem reset manual.
function computePeriodLabels() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), day = now.getDate();
  const mesInicio = new Date(y, m, 1);
  const mesFim = new Date(y, m + 1, 0);
  const [quinzenaInicio, quinzenaFim] = day <= 14
    ? [new Date(y, m, 1), new Date(y, m, 14)]
    : [new Date(y, m, 15), mesFim];
  return {
    quinzena: formatRange(quinzenaInicio, quinzenaFim),
    mes: formatRange(mesInicio, mesFim),
  };
}

async function fetchLeaderboard() {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/pix_sem_limites_leaderboard`, {
    method: "POST",
    headers: {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json",
    },
    body: "{}",
  });
  if (!res.ok) throw new Error("Falha ao buscar dados");
  return res.json();
}

function renderPanel(containerId, merged, valueKey, qtdKey) {
  const sorted = [...merged].sort((a, b) => b[valueKey] - a[valueKey]);
  const maxVal = Math.max(1, sorted[0][valueKey]);
  const container = document.getElementById(containerId);

  container.innerHTML = sorted.map((c, idx) => `
    <div class="row${idx === 0 ? " rank-1" : ""}" style="--bar-color:${c.color}">
      <div class="bar-bg" style="width:${(c[valueKey] / maxVal) * 100}%"></div>
      <div class="rank-badge">${idx + 1}</div>
      <div class="name">${idx === 0 ? '<span class="crown">🏆</span>' : ""}${c.displayName}</div>
      <div class="value-wrap">
        <span class="value">${formatBRL(c[valueKey])}</span>
        <span class="qtd">${c[qtdKey]} res.</span>
      </div>
    </div>
  `).join("");
}

async function refresh() {
  try {
    const rows = await fetchLeaderboard();
    const byOperador = {};
    rows.forEach(r => { byOperador[r.operador] = r; });

    const merged = COMPETITORS.map(c => {
      const row = byOperador[c.operador] || { faturamento_quinzena: 0, qtd_quinzena: 0, faturamento_mes: 0, qtd_mes: 0 };
      return {
        ...c,
        faturamento_quinzena: Number(row.faturamento_quinzena) || 0,
        qtd_quinzena: row.qtd_quinzena || 0,
        faturamento_mes: Number(row.faturamento_mes) || 0,
        qtd_mes: row.qtd_mes || 0,
      };
    });

    renderPanel("rows-quinzena", merged, "faturamento_quinzena", "qtd_quinzena");
    renderPanel("rows-mes", merged, "faturamento_mes", "qtd_mes");

    document.getElementById("lastUpdated").textContent = new Date().toLocaleTimeString("pt-BR");
  } catch (e) {
    console.error(e);
  }
}

function renderPeriodLabels() {
  const { quinzena, mes } = computePeriodLabels();
  document.getElementById("range-quinzena").textContent = quinzena;
  document.getElementById("range-mes").textContent = mes;
}

renderPeriodLabels();
refresh();
setInterval(refresh, 60 * 1000);
setInterval(renderPeriodLabels, 60 * 1000);
</script>

</body>
</html>
